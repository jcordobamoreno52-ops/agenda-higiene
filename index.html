<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B4F7C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda Higiene">
<title>Agenda Higiene 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: planner. Sticky header with view switch + legend; week grid (people × days) as the main surface; month, day and workload views share the same cards. */
:root{
  --bg:#EDF4FB; --surface:#FFFFFF; --surface-2:#F4F8FD; --ink:#13243B; --muted:#5A6C84; --line:#D5E3F1;
  --accent:#1C74C6; --accent-ink:#FFFFFF; --accent-soft:#E0EEFB; --sky:#4CB4EA; --sky-soft:#E3F4FC; --info:#0E86C9; --info-soft:#DDF0FB;
  /* estados (colores que ya usa el equipo) */
  --st-p:#3D7BE0; --st-p-soft:#E3EDFC; --st-g:#E9A800; --st-g-soft:#FDF3D3; --st-c:#E0412F; --st-c-soft:#FCE3DF; --st-pc:#93A6BD; --st-pc-soft:#FFFFFF;
  --adm:#7E66D3; --adm-soft:#EFEBFB; --aus:#2FA27E; --aus-soft:#E1F5EE; --fest:#B6C3D3;
  --past:#A3AFBD; --past-soft:#F1F3F6;
  --shadow:0 1px 2px rgba(19,36,59,.05),0 10px 30px rgba(28,116,198,.08);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1522; --surface:#122033; --surface-2:#17283E; --ink:#E4EDF7; --muted:#95A7BF; --line:#24395A;
  --accent:#6DB8F2; --accent-ink:#071A2C; --accent-soft:#183453; --sky:#7FCDF2; --sky-soft:#173547; --info:#5FC2F2; --info-soft:#123449;
  --st-p:#6EA2F5; --st-p-soft:#1A2F52; --st-g:#F2C04A; --st-g-soft:#3A3014; --st-c:#F2836F; --st-c-soft:#40211B; --st-pc:#7D90A8; --st-pc-soft:#122033;
  --adm:#AE9CF2; --adm-soft:#272148; --aus:#5FCCA8; --aus-soft:#15362C; --fest:#3A4D66;
  --past:#6E7F95; --past-soft:#16222F;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1522; --surface:#122033; --surface-2:#17283E; --ink:#E4EDF7; --muted:#95A7BF; --line:#24395A;
  --accent:#6DB8F2; --accent-ink:#071A2C; --accent-soft:#183453; --sky:#7FCDF2; --sky-soft:#173547; --info:#5FC2F2; --info-soft:#123449;
  --st-p:#6EA2F5; --st-p-soft:#1A2F52; --st-g:#F2C04A; --st-g-soft:#3A3014; --st-c:#F2836F; --st-c-soft:#40211B; --st-pc:#7D90A8; --st-pc-soft:#122033;
  --adm:#AE9CF2; --adm-soft:#272148; --aus:#5FCCA8; --aus-soft:#15362C; --fest:#3A4D66;
  --past:#6E7F95; --past-soft:#16222F;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.top{background:linear-gradient(120deg,var(--sky-soft),var(--surface) 60%);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.top-in{max-width:1400px;margin:0 auto;padding:12px 16px;display:grid;gap:10px}
.r1{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.r1 h1{font-size:1.4rem;font-weight:800}
.brand{display:flex;align-items:center;gap:10px}
.bmark{width:46px;height:46px;border-radius:12px;object-fit:contain;background:#fff;box-shadow:0 2px 8px rgba(11,79,124,.15)}
.btxt{display:grid;line-height:1.05}
.bname{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
.b1{color:#0B4F7C}.b2{color:#7FAE1C}
.bsub{font-family:var(--f-body);font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b1{color:#6DB8F2}:root:not([data-theme="light"]) .b2{color:#A6D447}}
:root[data-theme="dark"] .b1{color:#6DB8F2}:root[data-theme="dark"] .b2{color:#A6D447}
.r1 h1 small{font-family:var(--f-body);font-size:.78rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:.1rem .55rem;margin-left:8px;vertical-align:3px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:.38rem .95rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px rgba(28,116,198,.25)}
.r2{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav h2{font-size:1.15rem;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.45rem .95rem;font-weight:600;display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.icon{padding:.45rem .7rem}
.btn.danger{color:var(--st-c);border-color:var(--st-c)}
.btn.small{padding:.3rem .7rem;font-size:.86rem}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;border-radius:999px;padding:.18rem .6rem;border:1px solid var(--line);background:var(--surface)}
.lg i{width:10px;height:10px;border-radius:3px}
.lg b{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.banner{max-width:1400px;margin:10px auto 0;padding:0 16px}
.banner div{background:var(--st-g-soft);border:1px solid var(--st-g);border-radius:14px;padding:.55rem .9rem;font-size:.88rem;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}

.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input,.tools select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.42rem .9rem;min-width:0}
.tools input{flex:1 1 220px;max-width:340px}

/* week grid */
.gridwrap{overflow-x:auto;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.wk{display:grid;min-width:980px}
.wk .hd{position:sticky;top:0;background:var(--surface-2);border-bottom:1px solid var(--line);padding:.55rem .6rem;font-weight:700;z-index:2}
.wk .hd.day{cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:6px;border:0;border-bottom:1px solid var(--line);text-align:left;font:inherit;font-weight:700;color:inherit}
.wk .hd.day:hover{background:var(--accent-soft)}
.wk .hd.day small{font-weight:500;color:var(--muted);font-size:.78rem}
.wk .hd.today{background:var(--accent);color:var(--accent-ink)}
.wk .hd.today small{color:var(--accent-ink);opacity:.85}
.who{padding:.6rem .7rem;border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;gap:9px;align-items:flex-start;position:sticky;left:0;background:var(--surface);z-index:1}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.75rem;flex:0 0 30px;color:#fff}
.who b{display:block;font-size:.9rem;line-height:1.2}
.who small{color:var(--muted);font-size:.74rem}
.cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:6px;min-height:92px;position:relative;min-width:0}
.cell.past{background:var(--past-soft)}
.cell.todaycol{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.cell.hol{background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,transparent 8px 16px)}
.add{opacity:0;border:1.5px dashed var(--line);background:none;border-radius:10px;padding:.2rem;font-weight:700;color:var(--muted);font-size:.8rem;margin-top:auto}
.cell:hover .add,.add:focus-visible{opacity:1}
.holtag{font-size:.78rem;font-weight:700;color:var(--muted);text-align:center;padding:.3rem 0}

/* cards */
.ev{border-radius:12px;padding:.42rem .55rem;text-align:left;border:1px solid transparent;border-left:5px solid var(--c);background:var(--cs);display:grid;gap:3px;width:100%;min-width:0;transition:transform .08s}
.ev:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(19,36,59,.1)}
.ev .e1{font-weight:700;font-size:.84rem;line-height:1.2;overflow-wrap:anywhere}
.ev .e2{font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}
.ev .chips{display:flex;flex-wrap:wrap;gap:3px}
.ev .chips span{font-family:var(--f-mono);font-size:.68rem;font-weight:600;background:var(--surface);border-radius:6px;padding:0 5px;border:1px solid var(--line)}
.ev .st{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.ev.s-P{--c:var(--st-p);--cs:var(--st-p-soft)}
.ev.s-G{--c:var(--st-g);--cs:var(--st-g-soft)}
.ev.s-C{--c:var(--st-c);--cs:var(--st-c-soft)}
.ev.s-C .e1{text-decoration:line-through;text-decoration-thickness:1.5px}
.ev.s-PC{--c:var(--st-pc);--cs:var(--st-pc-soft);border:1px dashed var(--st-pc);border-left:5px solid var(--st-pc)}
.ev.k-adm{--c:var(--adm);--cs:var(--adm-soft)}
.ev.k-aus{--c:var(--aus);--cs:var(--aus-soft)}
.ev.past{--c:var(--past);--cs:var(--surface);filter:saturate(.2);opacity:.75}
.ev.past.s-C{--c:var(--st-c)}

/* month */
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.mo .dow{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.md{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:118px;padding:8px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.md:hover{border-color:var(--accent)}
.md.out{opacity:.4}
.md.today{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.md.past{background:var(--past-soft)}
.md .n{font-family:var(--f-mono);font-weight:600;font-size:.85rem;display:flex;justify-content:space-between}
.md .row{display:flex;align-items:center;gap:5px;font-size:.74rem;min-width:0}
.md .row i{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.md .row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md .more{font-size:.72rem;color:var(--muted);font-weight:700}
.md .hol{font-size:.72rem;font-weight:700;color:var(--muted)}

/* day */
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:10px;align-content:start;box-shadow:var(--shadow)}
.pcard .h{display:flex;gap:10px;align-items:center;justify-content:space-between}
.pcard .h>div{display:flex;gap:10px;align-items:center;min-width:0}
.free{border:1.5px dashed var(--line);border-radius:12px;padding:.7rem;text-align:center;color:var(--good,var(--aus));font-weight:700;font-size:.88rem;background:none}
.ev.big{padding:.6rem .75rem}
.ev.big .e1{font-size:.95rem}
.ev.big .chips span{font-size:.74rem}

/* load */
.loadgrid{display:grid;gap:10px}
.lrow{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,14rem) minmax(0,1fr) auto;gap:16px;align-items:center}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.lstats{display:flex;gap:14px;font-size:.82rem;color:var(--muted);white-space:nowrap}
.lstats b{font-family:var(--f-mono);color:var(--ink);font-size:1rem;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:.8rem 1rem;box-shadow:var(--shadow)}
.kpi b{font-family:var(--f-display);font-size:1.7rem;display:block;line-height:1.1}
.kpi span{font-size:.82rem;color:var(--muted)}

/* people */
.plist{display:grid;gap:8px;max-width:720px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.6rem .8rem;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.prow.off{opacity:.55}
.prow .acts{display:flex;gap:4px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,22,38,.45);z-index:50}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:51;width:min(620px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:grid;gap:14px}
.modal h3{font-size:1.25rem}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.f{display:grid;gap:4px}
.f.full{grid-column:1/-1}
.f label,.lbl{font-size:.78rem;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:.5rem .65rem;width:100%}
.f textarea{min-height:64px;resize:vertical}
.stpick{display:flex;flex-wrap:wrap;gap:6px}
.stpick button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.32rem .8rem;font-weight:700;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.stpick button i{width:10px;height:10px;border-radius:3px}
.stpick button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.meds{display:grid;gap:6px}
.med{display:grid;grid-template-columns:70px 110px minmax(0,1fr) minmax(0,9rem) auto;gap:6px}
.med input,.med select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:.4rem .5rem;width:100%;min-width:0}
.mact{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.days7{display:flex;gap:6px;flex-wrap:wrap}
.days7 label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:.25rem .65rem;font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.65rem 1.1rem;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px}
.codes{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:12px}
.codes b{font-family:var(--f-mono);color:var(--ink)}

.ttl{border:0;background:none;display:grid;grid-template-columns:auto auto;align-items:center;column-gap:6px;text-align:left;padding:.15rem .6rem;border-radius:12px;line-height:1.1}
.ttl:hover{background:var(--accent-soft)}
.ttl .tm{font-family:var(--f-display);font-weight:800;font-size:1.3rem;grid-column:1}
.ttl .ts{font-size:.8rem;color:var(--muted);font-weight:600;grid-column:1}
.ttl .tc{grid-column:2;grid-row:1/3;color:var(--muted);font-size:.8rem}
.picker{position:fixed;z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(10,22,38,.18);padding:12px;width:280px}
.pk-h{font-weight:800;font-family:var(--f-display);margin-bottom:8px;text-align:center}
.pk-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pk-g button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.45rem 0;font-weight:700}
.pk-g button:hover{border-color:var(--accent)}
.pk-g button.now{color:var(--accent)}
.pk-g button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lg.alert{background:var(--st-c-soft);color:var(--st-c);border-color:var(--st-c);cursor:pointer}
.ev.warn{box-shadow:0 0 0 2px var(--st-c)}
.ev.warnb{box-shadow:0 0 0 2px var(--info)}
.wdot.b{background:var(--info)}
.lg.alertb{background:var(--info-soft);color:var(--info);border-color:var(--info);cursor:pointer}
.ai.b{background:var(--info-soft)}
.mmbox.b{background:var(--info-soft)}
.tar{width:100%;border-collapse:collapse;font-size:.84rem}
.tar th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:.35rem .3rem;text-align:right;white-space:nowrap}
.tar th:first-child,.tar td:first-child{text-align:left}
.tar td{padding:.25rem .3rem;border-top:1px solid var(--line)}
.tar input{width:100%;min-width:84px;border:1px solid var(--line);border-radius:8px;padding:.3rem .4rem;background:var(--surface-2);text-align:right;font-family:var(--f-mono);font-size:.8rem}
.login{max-width:420px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow);display:grid;gap:12px}
.login input{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:.6rem .7rem}
.wdot{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--st-c);color:#fff;font-size:.65rem;margin-left:6px;letter-spacing:0;vertical-align:1px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .8rem;font-weight:700;min-width:54px}
.mchips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:1.05rem;margin-bottom:2px}
.card .sub{font-size:.85rem;color:var(--muted);margin:0 0 10px}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mc{border-radius:20px;padding:.9rem 1.1rem;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;gap:3px}
.mc b{font-family:var(--f-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.mc span{font-size:.84rem;color:var(--muted)}
.mc.hero{background:linear-gradient(135deg,var(--accent),var(--sky));border-color:transparent;color:var(--accent-ink)}
.mc.hero span{color:var(--accent-ink);opacity:.88}
.mc.hero2{background:linear-gradient(135deg,#2FA27E,#4CC3A0);border-color:transparent;color:#fff}
.mc.hero2 span{color:#fff;opacity:.9}
.split{display:flex;height:8px;border-radius:5px;overflow:hidden;margin-top:6px;background:rgba(255,255,255,.3)}
.split i{display:block;height:100%}
.ptools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.opt{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:.88rem;color:var(--muted)}

.donut{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;align-items:center}

.ptab tr.tot td{font-weight:800;border-bottom:0}
.alist{display:grid;gap:6px;max-height:340px;overflow:auto}
.ai{border-radius:12px;background:var(--st-c-soft);padding:.5rem .7rem;font-size:.85rem;display:grid;gap:2px;text-align:left;border:0;width:100%}

.aiact{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

.mc .comp b{font-family:var(--f-mono);font-size:.95rem;line-height:1.3}
.mc .comp span{color:inherit;font-size:.86rem}
.compbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.compbar i{display:block;height:100%}
.explain{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.7rem 1rem;font-size:.88rem;margin-top:10px;display:flex;gap:10px;align-items:flex-start}

@media (max-width:900px){.pgrid{grid-template-columns:minmax(0,1fr)}.donut{grid-template-columns:minmax(0,1fr);justify-items:center}.dleg{width:100%}}

const CODEMAP=d=>{d=(d||'').toUpperCase();if(/ILUMIN|NINELES/.test(d))return'NI';if(/DOSIMETR/.test(d))return'DO';if(/SONOMETR/.test(d))return'SO';if(/PARTICUL|SILICE/.test(d))return'TMP';if(/LECTURA DIREC|GASES/.test(d))return'GASES';if(/QUIMIC|VAPORES|ACIDOS/.test(d))return'TMQ';if(/TERMIC|TEMPERAT|TEMERAT/.test(d))return'CET';if(/CUERPO/.test(d))return'VCE';if(/MANO/.test(d))return'VMB';if(/VIBRACI/.test(d))return'VCE';return''};
const ARLMAP={'Seguros de vida Suramericana SA':'Sura','Positiva compañía de seguros SA':'Positiva','Axa Colpatria seguros de vida SA':'Axa Colpatria','Conhintec SAS':'Particular','Compañía de seguros de vida Colmena SA':'Colmena','Compañía de seguros colsanitas SA':'Colsanitas'};
async function loadCora(file){toast('Leyendo el archivo de Cora…');

  try{const wb=XLSX.read(await file.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    const hd=rows[0].map(x=>String(x).toLowerCase());const col=re=>hd.findIndex(x=>re.test(x));
    const ix={cli:col(/cliente/),est:col(/^estado/),cp:col(/contapyme/),oc:col(/no\.? ?oc/),arl:col(/^arl/),det:col(/detalle/),prof:col(/profesional/),pu:col(/precio de venta/)};
    if(ix.cp<0||ix.det<0||ix.pu<0){toast('Ese archivo no tiene las columnas de Cora (Contapyme, Detalle, Precio de venta).');return}
    CORA=rows.slice(1).filter(r=>r[ix.cp]||r[ix.oc]).map(r=>[String(r[ix.cp]).trim(),String(r[ix.oc]).replace(/\.0$/,'').trim(),CODEMAP(r[ix.det]),ARLMAP[r[ix.arl]]||r[ix.arl],+r[ix.pu]||0,String(r[ix.prof]).split(': ').pop().trim(),r[ix.cli],r[ix.est],String(r[ix.det]).slice(0,60)]);
    CORA_SRC=file.name+' ('+CORA.length+' filas, cargado el '+fmt(TODAY,{day:'numeric',month:'short'})+')';
    store.set('cora',CORA);store.set('cora_src',CORA_SRC);if(CLOUD&&sb)sb.from('ajustes').upsert({clave:'cora',valor:{rows:CORA,src:CORA_SRC}}).then(({error})=>{if(error)toast('El archivo se cargó aquí, pero no se pudo compartir con el equipo.')});buildIdx();DEF=defPrices();MMC.clear();render();toast('Precios y asignaciones actualizados con '+CORA.length+' filas.')}
  catch(e){toast('No se pudo leer el archivo.')}}

function subscribe(){
